<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    .top-bar {
      padding: 10px;
      background-color: #f1f1f1;
      text-align: center;
      border-bottom: 1px solid #ccc;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      border: none;
      display: block;
    }

    .error {
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top-bar">
      <a href="/">
        <button>Exit</button>
      </a>
    </div>

    <iframe id="gameFrame"></iframe>

  </div>

  <script>
    const games = {
      1: "1.html",
      2: "2.html",
      3: "3fix.html",
      4: "4fix2.html",

      5: "game/fgorilla/index.html",
      6: "game/hlxash/index.html",
      7: "game/sm64/index.html"
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    const frame = document.getElementById("gameFrame");

    if (id && games[id]) {
      frame.src = games[id];
    } else {
      frame.remove();

      const error = document.createElement("div");
      error.className = "error";
      error.innerHTML = "<h2>Game not found</h2><p>Invalid or missing game ID.</p>";

      document.querySelector(".container").appendChild(error);
    }
  </script>

</body>
</html>
