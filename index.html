<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>

<div id="games"></div>

<script>
    const games = document.getElementById("games");

    async function loadGames() {
        try {
            const response = await fetch(
                "https://api.github.com/repos/computerguy0323/gee-enn-math-mirror/contents"
            );

            if (!response.ok) {
                throw new Error("GitHub API error");
            }

            const files = await response.json();

            const htmlFiles = files
                .filter(file =>
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".html") &&
                    file.name.toLowerCase() !== "index.html"
                )
                .sort((a, b) =>
                    a.name.localeCompare(b.name, undefined, {
                        numeric: true
                    })
                );

            const pngFiles = new Set(
                files
                    .filter(file =>
                        file.type === "file" &&
                        file.name.toLowerCase().endsWith(".png")
                    )
                    .map(file => file.name.toLowerCase())
            );

            htmlFiles.forEach(file => {
                const filename = file.name;

                // Get the number before the dash.
                // Example: 112-fix2.html -> 112
                const match = filename.match(/^(\d+)-/);

                if (!match) {
                    return;
                }

                const number = match[1];
                const imageName = number + ".png";

                if (!pngFiles.has(imageName.toLowerCase())) {
                    return;
                }

                const link = document.createElement("a");
                link.href = file.name;

                const image = document.createElement("img");
                image.src = imageName;
                image.alt = number;

                link.appendChild(image);
                games.appendChild(link);
            });

        } catch (error) {
            console.error(error);
        }
    }

    loadGames();
</script>

</body>
</html>
