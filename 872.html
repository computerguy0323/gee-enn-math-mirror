<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Birds Friends - Full Screen</title>
    <style>
        /* Strip out default spacing and prevent unnecessary scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Black background matches the game loading screen */
        }

        /* Enforce the game canvas to overlay the entire browser layout */
        iframe {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://webgames-hosting.rovio.com/AngryBirdsFriends_redsarcade/index.html" 
        allow="fullscreen; autoplay; gamepad">
    </iframe>

</body>
</html>
