<h1>gee-enn-math-mirror (GN-MATH)</h1><br><br><br>
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <link rel="icon" type="image/png" href="canvas.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        #games {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        #games a {
            display: block;
            width: 100px;
            height: 100px;
        }

        #games img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            border: 3px solid transparent;
            box-sizing: border-box;
        }

        #games img:hover {
            border-color: lime;
            box-shadow: 0 0 20px lime;
        }
    </style>
</head>

<body>

<div id="games"></div>

<script>
    const games = document.getElementById("games");

    async function loadGames() {
        try {
            const response = await fetch(
                "https://api.github.com/repos/computerguy0323/gee-enn-math-mirror/git/trees/main?recursive=1"
            );

            if (!response.ok) {
                throw new Error("GitHub API error");
            }

            const data = await response.json();

            if (data.truncated) {
                throw new Error("GitHub returned a truncated Git tree");
            }

            const files = data.tree;

            const pngFiles = new Set(
                files
                    .filter(file =>
                        file.type === "blob" &&
                        file.path.toLowerCase().endsWith(".png")
                    )
                    .map(file => file.path.toLowerCase())
            );

            const htmlFiles = files
                .filter(file =>
                    file.type === "blob" &&
                    file.path.toLowerCase().endsWith(".html") &&
                    !file.path.includes("/") &&
                    file.path.toLowerCase() !== "index.html" &&
                    file.path.toLowerCase() !== "launch.html" &&
                    file.path.toLowerCase() !== "player.html"
                )
                .map(file => {
                    const filename = file.path;
                    const match = filename.match(/^(\d+)(?:-|\.html$)/i);

                    if (!match) {
                        return null;
                    }

                    return {
                        file: filename,
                        id: Number(match[1])
                    };
                })
                .filter(game => game !== null)
                .filter(game => pngFiles.has(game.id + ".png"));

            /*
             * If multiple HTML files have the same number,
             * prefer the exact filename.
             */
            const gameMap = new Map();

            for (const game of htmlFiles) {
                const existing = gameMap.get(game.id);

                if (!existing) {
                    gameMap.set(game.id, game);
                    continue;
                }

                const exactCurrent = existing.file === game.id + ".html";
                const exactNew = game.file === game.id + ".html";

                if (exactNew && !exactCurrent) {
                    gameMap.set(game.id, game);
                }
            }

            const sortedGames = Array.from(gameMap.values())
                .sort((a, b) => a.id - b.id);

            sortedGames.forEach(game => {
                const link = document.createElement("a");

                link.href = "player.html?id=" + encodeURIComponent(game.id);

                const image = document.createElement("img");

                image.src = game.id + ".png";
                image.alt = game.id;
                image.loading = "lazy";

                link.appendChild(image);
                games.appendChild(link);
            });

            /*
             * Games in /game/
             */
            const specialGames = [
                {
                    name: "fgorilla",
                    path: "game/fgorilla/index.html",
                    image: "game/fgorilla/fgorilla.png"
                },
                {
                    name: "hlxash",
                    path: "game/hlxash/index.html",
                    image: "game/hlxash/hlxash.png"
                },
                {
                    name: "sm64",
                    path: "game/sm64/index.html",
                    image: "game/sm64/sm64.png"
                }
            ];

            specialGames.forEach(game => {
                const link = document.createElement("a");

                link.href = game.path;

                const image = document.createElement("img");

                image.src = game.image;
                image.alt = game.name;
                image.loading = "lazy";

                link.appendChild(image);
                games.appendChild(link);
            });

        } catch (error) {
            console.error("Could not load games:", error);

            games.textContent = "Could not load games.";

            /*
             * Still show the /game/ games if the GitHub API fails.
             */
            const specialGames = [
                {
                    name: "fgorilla",
                    path: "game/fgorilla/index.html",
                    image: "game/fgorilla/fgorilla.png"
                },
                {
                    name: "hlxash",
                    path: "game/hlxash/index.html",
                    image: "game/hlxash/hlxash.png"
                },
                {
                    name: "sm64",
                    path: "game/sm64/index.html",
                    image: "game/sm64/sm64.png"
                }
            ];

            specialGames.forEach(game => {
                const link = document.createElement("a");

                link.href = game.path;

                const image = document.createElement("img");

                image.src = game.image;
                image.alt = game.name;

                link.appendChild(image);
                games.appendChild(link);
            });
        }
    }

    loadGames();
</script>

</body>
</html>
