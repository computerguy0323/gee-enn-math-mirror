<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        #games {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        #games a {
            display: block;
            width: 100px;
            height: 100px;
        }

        #games img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            border: 3px solid transparent;
            box-sizing: border-box;
        }

        #games img:hover {
            border-color: yellow;
            box-shadow: 0 0 20px yellow;
        }
    </style>
</head>

<body>

<div id="games"></div>

<script>
    const games = document.getElementById("games");

    async function loadGames() {
        try {
            const response = await fetch(
                "https://api.github.com/repos/computerguy0323/gee-enn-math-mirror/contents"
            );

            if (!response.ok) {
                throw new Error("GitHub API error");
            }

            const files = await response.json();

            const pngFiles = new Set(
                files
                    .filter(file =>
                        file.type === "file" &&
                        file.name.toLowerCase().endsWith(".png")
                    )
                    .map(file => file.name.toLowerCase())
            );

            const htmlFiles = files
                .filter(file =>
                    file.type === "file" &&
                    file.name.toLowerCase().endsWith(".html") &&
                    file.name.toLowerCase() !== "index.html" &&
                    file.name.toLowerCase() !== "launch.html"
                )
                .sort((a, b) =>
                    a.name.localeCompare(b.name, undefined, {
                        numeric: true
                    })
                );

            htmlFiles.forEach(file => {
                const match = file.name.match(/^(\d+)-/);

                if (!match) {
                    return;
                }

                const number = match[1];
                const imageName = number + ".png";

                if (!pngFiles.has(imageName.toLowerCase())) {
                    return;
                }

                const link = document.createElement("a");

                link.href = "launch.html?game=" + encodeURIComponent(file.name);

                const image = document.createElement("img");
                image.src = imageName;
                image.alt = number;
                image.loading = "lazy";

                link.appendChild(image);
                games.appendChild(link);
            });

        } catch (error) {
            console.error("Could not load games:", error);
        }
    }

    loadGames();
</script>

</body>
</html>
